services:
  sentinel:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////data/sentinel.db
      TRUSTED_ORIGINS: '["http://127.0.0.1:8000"]'
      ALLOWED_HOSTS: '["127.0.0.1","localhost"]'
      COOKIE_SECURE: "false"
      DEMO_ENABLED: "false"
    volumes:
      - sentinel-data:/data
    restart: unless-stopped
volumes:
  sentinel-data:
